name: Build Beather APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/beather.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/beather.jks" >> "$GITHUB_ENV"
            echo "Using permanent signing key"
          else
            echo "::warning::No KEYSTORE_BASE64 secret – APK is signed with a temporary key and cannot update an older install"
          fi
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk Beather.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Beather-apk
          path: Beather.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          name: Beather 2.3.${{ github.run_number }}
          body: Download **Beather.apk** below and open it on your Android phone to install.
          files: Beather.apk
          make_latest: true
