name: Build Beather APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk Beather.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Beather-apk
          path: Beather.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Beather 2.1.${{ github.run_number }}
          body: Download **Beather.apk** below and open it on your Android phone to install.
          files: Beather.apk
          make_latest: true
